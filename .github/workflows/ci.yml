name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore GoatShot.slnx
      - name: Build
        run: dotnet build GoatShot.slnx -c Release --no-restore
      - name: Test
        run: dotnet test GoatShot.slnx -c Release --no-build --logger "console;verbosity=minimal"
      - name: Vulnerability audit
        run: dotnet list GoatShot.slnx package --vulnerable --include-transitive
      - name: Browser extension syntax
        shell: pwsh
        run: Get-ChildItem browser-extension -Filter *.js -File | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE } }
      - name: Diff hygiene
        run: git diff --check
