name: personal-release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version without v prefix
        required: true
        default: 0.3.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.x
      - name: Resolve version
        id: version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $value = if ($env:EVENT_NAME -eq 'workflow_dispatch') { $env:INPUT_VERSION } else { $env:REF_NAME.TrimStart('v') }
          if ($value -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?$') {
            throw "Release version is invalid."
          }
          "value=$value" >> $env:GITHUB_OUTPUT
      - name: Restore, build, and test clean revision
        shell: pwsh
        run: |
          dotnet restore GoatShot.slnx
          dotnet build GoatShot.slnx -c Release --no-restore
          dotnet test GoatShot.slnx -c Release --no-build --logger "console;verbosity=minimal"
          dotnet list GoatShot.slnx package --vulnerable --include-transitive
      - name: Package Receipts release assets
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          BUILD_ID: ${{ github.sha }}
        run: .\scripts\package-release.ps1 -Version $env:RELEASE_VERSION -BuildId $env:BUILD_ID
      - name: Verify portable package
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\scripts\verify-portable-package.ps1 -PackagePath ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-win-x64-portable.zip" -RunCliSmoke
      - name: Verify single executable
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\scripts\verify-single-exe-package.ps1 -Version $env:RELEASE_VERSION
      - name: Verify installer package
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: .\scripts\verify-installer-package.ps1 -Version $env:RELEASE_VERSION
      - name: Create public release proof bundle
        shell: powershell
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
        run: |
          .\scripts\create-release-proof-bundle.ps1 `
            -Version $env:RELEASE_VERSION `
            -OutputRoot '.\artifacts\tag-release-proof' `
            -SkipCommands `
            -SkipTrancheNotes `
            -AdditionalArtifactPath @(
              '.\artifacts\single-exe-package-verification\single-exe-package-verification.json',
              '.\artifacts\single-exe-package-verification\single-exe-package-verification.md',
              '.\artifacts\portable-package-verification\portable-package-verification.json',
              '.\artifacts\portable-package-verification\portable-package-verification.md',
              '.\artifacts\installer-package-verification\installer-package-verification.json',
              '.\artifacts\installer-package-verification\installer-package-verification.md',
              ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-win-x64-single-exe.exe.sha256",
              ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-win-x64.exe.sha256",
              ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-win-x64.build.json",
              ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-win-x64.spdx.json",
              ".\artifacts\dist\Receipts-$env:RELEASE_VERSION-THIRD-PARTY-NOTICES.txt"
            )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Receipts-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64-portable.zip
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64-single-exe.exe
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64-single-exe.exe.sha256
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64.exe
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64.exe.sha256
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64.build.json
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-win-x64.spdx.json
            artifacts/dist/Receipts-${{ steps.version.outputs.value }}-THIRD-PARTY-NOTICES.txt
            artifacts/portable-package-verification/**
            artifacts/single-exe-package-verification/**
            artifacts/installer-package-verification/**
            artifacts/tag-release-proof/Receipts-release-proof-*.zip
          if-no-files-found: error
      - name: Publish GitHub prerelease for tag builds
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION
          $releaseAssets = @(
            Get-ChildItem -LiteralPath '.\artifacts\dist' -Filter "Receipts-$version-*" -File
            Get-ChildItem -LiteralPath '.\artifacts\tag-release-proof' -Filter 'Receipts-release-proof-*.zip' -File
          ) | ForEach-Object FullName
          if ($releaseAssets.Count -eq 0) {
            throw 'No Receipts release assets were found.'
          }
          gh release create $env:RELEASE_TAG @releaseAssets --prerelease --title "Receipts $env:RELEASE_TAG" --notes 'Unsigned Windows x64 Receipts preview. Windows SmartScreen may warn. Verify the published SHA-256 before running. Clean-profile, sign-in startup, long-run hardware, full accessibility, and live capture-device proof remain open.'
